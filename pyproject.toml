[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spreadsheet-reverse-engineer"
version = "0.1.0"
description = "Read-only, descriptive spreadsheet dependency analysis"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sre = "sre.cli:main"

[tool.setuptools.packages.find]
include = ["sre*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
